spring.application.name=gopoli-api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json
server.error.include-stacktrace=never
server.error.include-message=never
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gopoli}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gopoli}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gopoli}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=20

logging.level.root=${LOG_LEVEL:INFO}

gopoli.jwt.secret=${GOPOLI_JWT_SECRET}
gopoli.jwt.expiration-hours=${GOPOLI_JWT_EXPIRATION_HOURS:168}
gopoli.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
gopoli.timezone=${APP_TIMEZONE:America/Bogota}
